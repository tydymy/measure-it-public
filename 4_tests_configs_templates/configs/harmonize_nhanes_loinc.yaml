  - {variable: LBXBCD, loinc: 5609-3, loinc_name: "Cadmium [Mass/volume] in Blood", unit: "ug/L", confidence: high, rationale: "whole-blood cadmium"}
  - {variable: LBXTHG, loinc: 5685-3, loinc_name: "Mercury [Mass/volume] in Blood", unit: "ug/L", confidence: high, rationale: "whole-blood total mercury"}
  - {variable: LBXBSE, loinc: 5722-4, loinc_name: "Selenium [Mass/volume] in Blood", unit: "ug/L", confidence: high, rationale: "whole-blood selenium"}
  - {variable: LBXBMN, loinc: 5681-2, loinc_name: "Manganese [Mass/volume] in Blood", unit: "ug/L", confidence: high, rationale: "whole-blood manganese"}
  - {variable: LBXSCU, loinc: 5631-7, loinc_name: "Copper [Mass/volume] in Serum or Plasma", unit: "ug/dL", confidence: high, rationale: "serum copper"}
  - {variable: LBXSZN, loinc: 5763-8, loinc_name: "Zinc [Mass/volume] in Serum or Plasma", unit: "ug/dL", confidence: high, rationale: "serum zinc"}
  - {variable: SSSNFL, loinc: 101281-4, loinc_name: "Neurofilament light chain [Mass/volume] in Serum or Plasma by Immunoassay", unit: "pg/mL", accept_units: ["pg/ml"], confidence: medium, rationale: "surplus-serum NfL by immunoassay (research-use assay)"}
  # ---------------------------------------------------------------- exam measures (participant_clinical_features)
  - {variable: sbp_mean_mmhg, source: clinical_features, loinc: 8480-6, loinc_name: "Systolic blood pressure", unit: "mm[Hg]", confidence: medium, rationale: "mean of the MEC auscultatory readings (the LOINC term is a single reading)"}
  - {variable: dbp_mean_mmhg, source: clinical_features, loinc: 8462-4, loinc_name: "Diastolic blood pressure", unit: "mm[Hg]", confidence: medium, rationale: "mean of the MEC readings"}
  - {variable: exam_pulse_60s_bpm, source: clinical_features, loinc: 8867-4, loinc_name: "Heart rate", unit: "/min", confidence: medium, rationale: "60-second pulse at the MEC exam; LOINC 8867-4 is method-unspecified"}
  - {variable: weight_kg, source: clinical_features, loinc: 29463-7, loinc_name: "Body weight", unit: "kg", confidence: high, rationale: "measured weight"}
  - {variable: height_cm, source: clinical_features, loinc: 8302-2, loinc_name: "Body height", unit: "cm", confidence: high, rationale: "measured standing height"}
  - {variable: bmi, source: clinical_features, loinc: 39156-5, loinc_name: "Body mass index (BMI) [Ratio]", unit: "kg/m2", confidence: high, rationale: "BMI from measured weight and height"}
  - {variable: waist_cm, source: clinical_features, loinc: 56114-2, loinc_name: "Waist Circumference by NHANES", unit: "cm", confidence: high, rationale: "the LOINC term for the NHANES protocol (iliac crest)"}
