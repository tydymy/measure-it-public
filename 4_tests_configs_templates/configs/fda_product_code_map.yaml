    mapping_rationale: 'Early actigraphs (Actiwatch, wrist actigraph) were cleared under the EEG code GWQ. Generic
      code: counted only for records whose device name contains actigraph*/actiwatch*.'
    query_that_found_it: '510k: device_name:actiwatch*'
    device_filter: (device_name:actigraph* OR device_name:actiwatch*)
