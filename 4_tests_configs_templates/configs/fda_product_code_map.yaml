# Curated map: measurement class (configs/measurements.yaml) -> FDA product codes.
#
# Created by the openfda_device ingestion (measure_it.ingestion.openfda). Every code was
# returned by a recorded openFDA query (query_that_found_it; see
# data/raw/openfda_device/QUERY_LOG.json) and kept only if its FDA device_name/definition
# genuinely describes the measurement, or - for a generic code - if named-device records
# under it do, in which case the code is mapped only with a device_filter and every count is
# restricted to that filter. validate_code_map() in the module re-checks all of this on run.
#
# mapping_confidence: high = FDA name/definition states the measurement;
#   medium = category holds the measurement but is broader or names it indirectly;
#   low = partial/indirect match, or a generic code restricted by device_filter.
# Classes with no category carry an explicit 'no specific product code found' entry with
# the queries tried.
#
# A regulatory record is a deployment-readiness signal, not evidence that the technology
# diagnoses the target illness.
version: 1
created: '2026-09-23'
measurements:
  accelerometry:
  - product_code: LEL
    device_name: Device, Sleep Assessment
    device_class: '2'
    regulation_number: '882.5050'
    medical_specialty_description: Neurology
    mapping_confidence: medium
    mapping_rationale: 'Wrist actigraphs are cleared in this category: the device_name actigraph* search returned
      ActiGraph CentrePoint Insight Watch and ActiGraph LEAP under LEL. The FDA name describes sleep assessment,
      not activity measurement in general, hence medium.'
    query_that_found_it: '510k: device_name:actigraph*'
