# Bundles resolve to their members (configs/relevance.yaml); notes say what their capacity therefore measures.
bundles:
  wearable_autonomic_activity_monitoring:
    note: "Dedicated basis = ambulatory ECG monitoring with interpretation (ecg_ambulatory) + actigraphy (accelerometry, near zero volume). Heart-rate/PPG/HRV wearables have no code; RPM is related only. Capacity therefore measures cardiac rhythm-monitoring practice, not consumer-wearable programmes."
  nailfold_capillaroscopy:
    note: "Capillaroscopy has NO code; its proxies and microvascular_function's related codes (NIR tissue oximetry 0640T/0859T, limb physiologic studies 93922/93923) give the bundle a 'related' basis that measures vascular-lab and wound-care practice, not capillaroscopy. Read the capacity as indirect; outreach relies mainly on specialty (rheumatology) and experience sites."
  autonomic_function_testing:
    note: "Dedicated basis = 95921-95924 (autonomic_testing); 95921/95923 billing is dominated by office device programmes (internal medicine, NPs, podiatry), 95924 by neurology."
  exercise_capacity_testing:
    note: "Dedicated basis = 94621 CPET (pulmonology, cardiology)."
