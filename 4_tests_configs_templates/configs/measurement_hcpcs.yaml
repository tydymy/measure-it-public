      - {code: "93926", descriptor: "Duplex scan of lower extremity arteries or arterial bypass grafts; unilateral or limited", confidence: high, rationale: "Vascular ultrasound.", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
