      - {code: "0693T", descriptor: "Comprehensive full-body computer-based markerless 3D kinematic and kinetic motion analysis (Category III)", confidence: low, rationale: "0 rows in 2024.", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}

  digital_cognitive:
    summary: "No code for digital cognitive testing as such. 96146 (single standardized instrument via electronic platform with automated result) is the closest and is related; neuropsychological evaluation (96132) and cognitive assessment (99483) are not digital specific and are not used."
    related_codes:
      - {code: "96146", descriptor: "Psychological or neuropsychological test administration, single standardized instrument via electronic platform, automated result only", confidence: medium, rationale: "Electronic-platform testing; instrument unknown (may be a mood questionnaire).", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}

