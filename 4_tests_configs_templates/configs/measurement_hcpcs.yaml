  capillaroscopy:
    summary: "NO CPT or HCPCS code exists for nailfold (video)capillaroscopy: no Category I, III or HCPCS Level II descriptor in the CMS 2026 PFS mentions capillaroscopy or nailfold (the only 'capillary' code is 36416, capillary blood draw), none in the AMA Category III long-descriptor list, and US pediatric rheumatologists name 'inability to bill for procedure' as a barrier (Savani et al., CARRA survey, ACR 2020 abstract). It is absorbed into the E/M visit or billed as an unlisted code that cannot be attributed. Medicare claims therefore cannot show who performs it. The codes below are labelled PROXIES only: noninvasive extremity arterial physiologic studies, for which Raynaud phenomenon (I73.00/I73.01) is a covered indication (WPS A57593); 2024 billers are overwhelmingly cardiology/vascular (only ~4 rheumatology NPI rows each), so they mark vascular-lab capacity, not rheumatology capillaroscopy. The measurement's specialty tier (rheumatology, configs/relevance.yaml) is the main outreach signal."
    references:
      - "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"
      - "https://www.ama-assn.org/system/files/cpt-category3-codes-long-descriptors.pdf"
      - "https://acrabstracts.org/abstract/nailing-down-nailfold-capillaroscopy-practices-a-survey-of-pediatric-rheumatologists-within-the-childhood-arthritis-and-rheumatology-research-alliance-carra-network/"
    related_codes:
      - {code: "93922", proxy: true, descriptor: "Limited bilateral noninvasive physiologic studies of extremity arteries", confidence: low, rationale: "PROXY: peripheral vascular physiology for which Raynaud is a covered indication; not capillaroscopy.", source: "https://www.cms.gov/medicare-coverage-database/view/article.aspx?articleId=57593"}
      - {code: "93923", proxy: true, descriptor: "Complete bilateral noninvasive physiologic studies of extremity arteries, or single level with provocative functional maneuvers", confidence: low, rationale: "PROXY: as 93922; provocative maneuvers make digital cold-stress studies plausible but no explicit coding instruction was found.", source: "https://www.cms.gov/medicare-coverage-database/view/article.aspx?articleId=57593"}
    considered_not_used:
      - {code: "96931", reason: "96931-96936 are reflectance confocal microscopy of skin lesions, not dermoscopy or capillaroscopy", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
      - {code: "96999", reason: "unlisted dermatological procedure: 0 rows in 2024 and not attributable", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
      - {code: "Part D nintedanib (SSc-ILD)", reason: "considered as a systemic-sclerosis prescribing proxy: 4,284 prescriber rows in 2024 but only 34 rheumatology (pulmonology dominates, IPF); too few to help", source: "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=4d017c42-a823-452d-bc6f-0491dd9823e3"}

  microvascular_function:
    summary: "No code for laser Doppler/speckle microvascular reactivity was found. Noncontact near-infrared tissue oximetry has Category III codes (0640T first site, 0859T each additional; mostly wound care); TcPO2 is inside the limb physiologic study codes 93922/93923. All related, not dedicated."
    related_codes:
      - {code: "0640T", descriptor: "Noncontact near-infrared spectroscopy (tissue oxygenation, StO2), other than for PAD screening, image acquisition, interpretation and report; first anatomic site", confidence: medium, rationale: "A microvascular oxygenation measurement; in practice wound care.", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
      - {code: "0859T", descriptor: "Noncontact near-infrared spectroscopy; each additional anatomic site", confidence: medium, rationale: "As 0640T.", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
      - {code: "93922", descriptor: "Limited bilateral noninvasive physiologic studies of extremity arteries (may use TcPO2)", confidence: low, rationale: "TcPO2/PVR component; mostly macrovascular PAD testing.", source: "https://www.cms.gov/medicare-coverage-database/view/article.aspx?articleId=57593"}
      - {code: "93923", descriptor: "Complete noninvasive physiologic studies of extremity arteries, incl. reactive hyperemia maneuvers", confidence: low, rationale: "Reactive hyperemia / TcPO2 component; mostly PAD testing.", source: "https://www.cms.gov/medicare-coverage-database/view/article.aspx?articleId=57593"}

  retinal_imaging:
    summary: "Dedicated codes for OCT (retina, optic nerve/RNFL), OCT angiography (92137, new 2025), fundus photography and physician-read remote retinal imaging; technical/autonomous-AI remote imaging is related."
    codes:
      - {code: "92134", descriptor: "Ophthalmic diagnostic imaging (OCT), posterior segment, with interpretation and report; retina", confidence: high, rationale: "Retinal OCT.", source: "https://retinatoday.com/articles/2025-mar/oct-what-to-know-for-2025"}
      - {code: "92133", descriptor: "Ophthalmic diagnostic imaging (OCT), posterior segment; optic nerve", confidence: high, rationale: "Optic nerve / RNFL OCT.", source: "https://retinatoday.com/articles/2025-mar/oct-what-to-know-for-2025"}
      - {code: "92137", descriptor: "Ophthalmic imaging, retina, including OCT angiography, with interpretation and report (new 2025)", confidence: high, rationale: "OCT-A of retinal microvasculature; absent from 2024 data.", source: "https://retinatoday.com/articles/2025-mar/oct-what-to-know-for-2025"}
      - {code: "92250", descriptor: "Fundus photography with interpretation and report", confidence: high, rationale: "Fundus imaging.", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
      - {code: "92228", descriptor: "Imaging of retina for detection or monitoring of disease; with remote physician review and report", confidence: high, rationale: "Physician-read remote retinal imaging.", source: "https://www.aao.org/Assets/769678b5-a32f-4a17-a9df-5abacc892a5d/638092225390530000/noridian-a58914-r3-upd121622-eff010123-pdf?inline=1"}
    related_codes:
      - {code: "92227", descriptor: "Imaging of retina; with remote clinical staff review and report", confidence: low, rationale: "Technical-only.", source: "https://www.aao.org/Assets/769678b5-a32f-4a17-a9df-5abacc892a5d/638092225390530000/noridian-a58914-r3-upd121622-eff010123-pdf?inline=1"}
      - {code: "92229", descriptor: "Imaging of retina; point-of-care automated analysis and report", confidence: low, rationale: "Technical-only autonomous AI; primary care can bill it without an eye-care reader.", source: "https://www.aao.org/Assets/769678b5-a32f-4a17-a9df-5abacc892a5d/638092225390530000/noridian-a58914-r3-upd121622-eff010123-pdf?inline=1"}

  digital_gait:
    summary: "No wearable-gait code. Computer-based motion analysis codes exist (96000/96001, physician review 96004; markerless 0693T) with very low Medicare volume; related only."
    related_codes:
      - {code: "96000", descriptor: "Comprehensive computer-based motion analysis by video-taping and 3D kinematics", confidence: low, rationale: "Gait-lab motion analysis, not wearable.", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
      - {code: "96001", descriptor: "Computer-based motion analysis with dynamic plantar pressure measurements during walking", confidence: low, rationale: "As 96000.", source: "https://www.cms.gov/medicare/payment/fee-schedules/physician/pfs-relative-value-files/rvu26d"}
