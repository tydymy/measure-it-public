        subject: {from: gsm}
        compartment: plasma_ev
        assay: nanostring_mirna
        compat_class: plasma_ev_mirna
        matrix: {kind: nanostring_rcc, file: GSE141770_RAW.tar}
      - id: GSE141770_pbmc
        condition: me_cfs
        description: PBMC miRNA (NanoString); MECFS vs healthy
        filter: {"c:pbmc/ev": [PBMC]}
        label: {field: "c:condition", case: [MECFS], control: [Healthy Control]}
        subject: {from: gsm}
        compartment: pbmc
