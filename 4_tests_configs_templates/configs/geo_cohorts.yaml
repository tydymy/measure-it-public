        compat_class: serum_somascan
        matrix: {kind: series_matrix, file: GSE254030_series_matrix.txt.gz}
        covariates: ["c:Sex", "c:age"]
  GSE251790:
    subsets:
      - id: GSE251790
        condition: me_cfs
        description: CSF SomaScan (NIH PI-ME/CFS); patient vs control
        label: {field: "c:group", case: [Patient], control: [Control]}
        subject: {from: gsm}
        compartment: csf
        assay: somascan
        compat_class: csf_somascan
        matrix: {kind: series_matrix, file: GSE251790_series_matrix.txt.gz}
  GSE327255:
    subsets:
      - id: GSE327255
        condition: me_cfs
