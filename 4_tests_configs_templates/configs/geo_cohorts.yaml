# Public GEO case/control omics cohorts for Long COVID and ME/CFS (owner: measure_it.omics.geo_cohorts).
#
# Written 2026-09-24 from SAMPLE METADATA ONLY (GEO acc.cgi GSM text, series summaries and FTP file
# listings). No expression value was read when these rules were fixed. The analysis plan that uses
# them is docs/ANALYSIS_PLAN_GEO_COHORTS.md (written before any model was fitted).
#
# Screen universe: every row of geo_study_catalog with condition_id in {long_covid, me_cfs}
# (89 rows, 88 GSE). Each GSE must appear below either with `subsets` (a label rule the code
# evaluates: case/control subject counts, platform, tissue, matrix availability) or with
# `exclude` (a metadata-based reason code + note). tests/test_geo_cohorts.py enforces coverage.
#
# Eligibility (all required):
#   E1 human samples; person-level bulk profile (not in vitro, animal model, single-cell, autopsy)
#   E2 an explicit case/control label in sample characteristics, title or source name:
#      case = Long COVID / PASC (post-acute) or ME/CFS (CFS); control = healthy or recovered
#   E3 >= 15 case SUBJECTS and >= 15 control SUBJECTS in the analysable subset (one sample per
#      subject, a single platform, a single tissue, post-acute / baseline timepoint)
#   E4 a processed sample x feature matrix (series-matrix values, supplementary matrix, or
#      NCBI-generated counts) whose features were NOT constructed using the case/control labels
# Preference (ranking only): blood-derived compartment (whole blood, PBMC, leukocytes, plasma,
# serum, plasma cfRNA/EVs). Non-blood eligible subsets are used only if < 3 blood subsets pass.
#
# Selection rule (pre-specified): per condition, rank passing blood-derived subsets by analysable
# n (cases + controls), ties by min(group), then accession; take the top 3 as PRIMARY. If none of
# the primary subsets of a condition shares a compatibility class with another primary subset,
# the largest passing subset of the same class as a primary subset is added as REPLICATION-ONLY
# (used for cross-dataset transfer and signature overlap; its within-dataset classifier is also
# reported). Compatibility classes: blood_leukocyte_transcriptome (whole blood / PBMC / PBL
# mRNA on array, RNA-seq or NanoString), plasma_cfrna, tcell_methylation_450k, serum_somascan,
# plasma_ev_mirna, pbmc_mirna_array.

min_per_group: 15
blood_compartments: [whole_blood, pbmc, leukocytes, plasma, serum, plasma_cfrna, plasma_ev, tcells_blood]
max_primary_per_condition: 3

series:
  # ------------------------------------------------------------------ Long COVID: label rules
  GSE226260:
    subsets:
      - id: GSE226260_wb
        condition: long_covid
        description: whole blood RNA-seq (GPL34284) of the Barouch cohort; 'current long_covid_status' PASC vs Recovered
        filter: {platform_id: [GPL34284]}
        label: {field: "c:current long_covid_status", case: [PASC], control: [Recovered]}
        exclude_timepoints: {field: "c:time of_blood_draw", values: [Acute]}
        subject: {from: title, regex: '^([^.]+)\.'}
        one_per_subject: earliest_post_acute   # order by the day number in the title (2nd dot field)
        order: {from: title, regex: '^[^.]+\.(\d+)\.', numeric: true}
        compartment: whole_blood
        assay: rnaseq_counts
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: suppl_csv, file: GSE226260_AdditionalSamples.rawCounts.csv.gz}
        covariates: []
        timing: "post-acute; blood drawn 3-6, 6-12 or >12 months after infection (4 'Acute' draws excluded)"
      - id: GSE226260_pbmc
        condition: long_covid
        description: PBMC RNA-seq (GPL24676), 'pasc status' PASC vs NOPASC
        filter: {platform_id: [GPL24676], source_name_ch1: [PBMC]}
        label: {field: "c:pasc status", case: [PASC], control: [NOPASC]}
        subject: {from: "c:subject id"}
        compartment: pbmc
        assay: rnaseq_counts
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: suppl_csv, file: GSE226260_combined.ExprData.updated.csv.gz}
        covariates: ["c:gender", "c:age"]
        timing: "serial draws; acute and convalescent"
  GSE270045:
    subsets:
      - id: GSE270045
        condition: long_covid
        also_condition: me_cfs   # patients met ME/CFS criteria after SARS-CoV-2 infection (series summary)
        description: whole blood RNA-seq (GPL34284); title 'Long Covid N' vs 'Healthy Control N'
        label: {field: title, case_regex: '^Long Covid', control_regex: '^Healthy Control'}
        subject: {from: "c:sample id"}
        compartment: whole_blood
        assay: rnaseq_counts
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: suppl_tsv, file: GSE270045_LC_counts.tsv.gz}
        covariates: []
        timing: "post-COVID ME/CFS (series summary); time since infection not in metadata"
  GSE275334:
    subsets:
      - id: GSE275334_lc
        condition: long_covid
        description: PBMC NanoString nCounter Immune Exhaustion panel (785 genes); Long COVID vs healthy control
        filter: {"c:disease": [Long COVID, Healthy control]}
        label: {field: "c:disease", case: [Long COVID], control: [Healthy control]}
        subject: {from: gsm}
        compartment: pbmc
        assay: nanostring
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: nanostring_rcc, file: GSE275334_RAW.tar}
        covariates: ["c:Sex", "c:age (years)"]
        timing: "WHO post COVID-19 condition definition (series summary)"
      - id: GSE275334_mecfs
        condition: me_cfs
        description: same panel; ME/CFS (Canadian Consensus Criteria) vs healthy control
        filter: {"c:disease": [ME/CFS, Healthy control]}
        label: {field: "c:disease", case: [ME/CFS], control: [Healthy control]}
        subject: {from: gsm}
        compartment: pbmc
        assay: nanostring
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: nanostring_rcc, file: GSE275334_RAW.tar}
        covariates: ["c:Sex", "c:age (years)"]
  GSE222128:
    subsets:
      - id: GSE222128
        condition: long_covid
        description: influenza-vaccination superseries; COVID-recovered with 'long-covid symptoms' Y vs healthy controls, pre-vaccination draws
        filter: {"c:visit": [Day -7, Day 0], source_name_ch1: [Whole Blood]}
        label: {field: "c:long-covid symptoms", case: [Y], control_field: "c:group", control: [HC]}
        subject: {from: "c:subject id"}
        compartment: whole_blood
        assay: rnaseq_counts
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: none_checked}
  GSE194378:
    subsets:
      - id: GSE194378
        condition: long_covid
        description: RNA-seq sub-series of GSE222128 (same subjects)
        filter: {"c:visit": [Day -7, Day 0]}
        label: {field: "c:long-covid symptoms", case: [Y], control_field: "c:group", control: [HC]}
        subject: {from: "c:subject id"}
        compartment: whole_blood
        assay: rnaseq_counts
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: none_checked}
  GSE297499:
    subsets:
      - id: GSE297499_pbmc
        condition: long_covid
        description: PBMC, neuropsychiatric Long COVID vs control
        filter: {"c:tissue": [PBMC]}
        label: {field: "c:treatment", case: [NP-Long COVID], control: [Control]}
        subject: {from: gsm}
        compartment: pbmc
        assay: rnaseq
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: none_checked}
      - id: GSE297499_csf
        condition: long_covid
        description: CSF cells, neuropsychiatric Long COVID vs control
        filter: {"c:tissue": [Cerebrospinal Fluid]}
        label: {field: "c:treatment", case: [NP-Long COVID], control: [Control]}
        subject: {from: gsm}
        compartment: csf
        assay: rnaseq
        compat_class: csf_cells
        matrix: {kind: none_checked}
  GSE225942:
    subsets:
      - id: GSE225942
        condition: long_covid
        description: PBMC; Neuro-PASC vs COVID convalescent (series type 'Other')
        label: {field: "c:disease state", case: [Neuro-PASC], control: [COVID convalescent]}
        subject: {from: gsm}
        compartment: pbmc
        assay: other
        compat_class: other
        matrix: {kind: none_checked}
  GSE224615:
    subsets:
      - id: GSE224615
        condition: long_covid
        description: PBMC at 8 months; LC vs Non-LC
        label: {field: "c:lc status", case: [LC], control: [Non-LC]}
        subject: {from: "c:pid"}
        compartment: pbmc
        assay: rnaseq
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: none_checked}
  GSE251849:
    subsets:
      - id: GSE251849
        condition: long_covid
        description: PBMC; Long COVID (+/- brain fog) vs healthy or convalescent
        label: {field: "c:group", case: [Long COVID, Long COVID brain fog], control: [Healthy, COVID convalescent]}
        subject: {from: gsm}
        compartment: pbmc
        assay: rnaseq
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: none_checked}
  GSE339049:
    subsets:
      - id: GSE339049
        condition: long_covid
        description: monocyte ATAC-seq; severe + mild long COVID vs nonsymptomatic recovered donors
        label: {field: "c:donor group", case: [Severe, Mild], control: [Nonsymptomatic]}
        subject: {from: title, regex: '^([^_]+)_'}
        compartment: monocytes_blood
        assay: atac_peak_counts
        compat_class: monocyte_atac
        matrix: {kind: label_aware, file: GSE339049_Counts.tsv.gz,
                 note: "GSM data_processing: peaks called on BAMs pooled PER PATIENT GROUP and filtered for >= 0.3 CPM in > 15 samples of a single patient group; the feature set was defined with the labels, which in-fold selection cannot undo (E4 fails)"}
  # ------------------------------------------------------------------ ME/CFS: label rules
  GSE293840:
    subsets:
      - id: GSE293840
        condition: me_cfs
        description: plasma cell-free RNA-seq; ME/CFS case vs healthy sedentary control
        label: {field: "c:phenotype", case: [case], control: [control]}
        subject: {from: title, regex: 'subject: ([^,]+),'}
        compartment: plasma_cfrna
        assay: rnaseq_counts
        compat_class: plasma_cfrna
        matrix: {kind: suppl_csv, file: GSE293840_raw_counts_all.csv.gz}
        covariates: ["c:Sex", "c:age bin", "c:batch", "c:test site"]
        timing: "established ME/CFS; single draw"
  GSE156792:
    subsets:
      - id: GSE156792
        condition: me_cfs
        description: CD3+ T-cell DNA methylation (450K); CFS vs control
        label: {field: "c:sample group", case: [CFS], control: [control]}
        subject: {from: gsm}
        compartment: tcells_blood
        assay: methylation_450k
        compat_class: tcell_methylation_450k
        matrix: {kind: series_matrix, file: GSE156792_series_matrix.txt.gz, platform_annot: GPL13534_manifest}
        # the M/U intensity files carry no probe ids (485,512 unlabelled rows), so the series-matrix beta values are used
        covariates: []
  GSE16059:
    subsets:
      - id: GSE16059
        condition: me_cfs
        description: peripheral blood leukocytes, Affymetrix U133 Plus 2.0; CFS vs unaffected monozygotic co-twin (ICF pairs excluded)
        label: {field: "c:diagnonsis", case: [CFS], control: [unaffected]}
        pair: {field: "c:twin pair"}   # controls kept only when their co-twin is a CFS case
        subject: {from: gsm}
        compartment: leukocytes
        assay: affymetrix_gpl570
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: series_matrix, file: GSE16059_series_matrix.txt.gz, platform_annot: GPL570}
        covariates: []   # sex is matched within twin pairs, so a covariate baseline is uninformative by design
  GSE227375:
    subsets:
      - id: GSE227375
        condition: me_cfs
        description: PBMC RNA-seq at baseline (T0) before exercise challenge; single largest platform (GPL21290)
        filter: {"c:time point in exercise": [T0 (baseline)], platform_id: [GPL21290]}
        label: {field: "c:disease state", case: [ME/CFS patient, ME/CFS patients], control: [healthy control]}
        subject: {from: gsm}
        compartment: pbmc
        assay: rnaseq_counts
        compat_class: blood_leukocyte_transcriptome
        matrix: {kind: ncbi_counts, file: GSE227375_raw_counts_GRCh38.p13_NCBI.tsv.gz}
        covariates: ["c:Sex"]
        timing: "baseline draw before a CPET challenge"
  GSE128078:
