# =====================================================================================================
# PRE-SPECIFIED ANALYSIS PLAN (fixed 2026-09-24, after the metadata screen and matrix downloads and
# BEFORE any model, test statistic or case/control comparison on expression/methylation/count values).
# The code reads every parameter below; nothing is tuned. Anything not named here is post hoc.
# (The harness does not allow writing docs/ANALYSIS_PLAN_GEO_COHORTS.md; this block is the plan.)
# =====================================================================================================
analysis_plan:
  fixed_at: "2026-09-24T09:35:00+00:00"
  question: >-
    Do public case/control omics cohorts carry person-level signal for Long COVID or ME/CFS that replicates in an
    independent cohort? Within-dataset discrimination is necessary, not sufficient (case/control batch confounding);
    cross-cohort transfer is the decisive test. This is an omics question, not a device validation.
  preprocessing:
    rnaseq_counts: "NCBI Gene Homo_sapiens.gene_info (GeneID/Symbol/chromosome/Ensembl xref; GEO annot.tsv link served a reCAPTCHA page, switched before modelling); sum duplicate ids; keep CPM>=1 in >=20% of samples; log2(CPM+1), library size = all counted genes"
    nanostring: "RCC: positive-control geomean scaling, then Housekeeping-class geomean scaling; Endogenous only; log2(count+1)"
    affymetrix: "series-matrix VALUE; log2 if 99th percentile > 100; probe->symbol from GPL570.annot; per gene the probe with the highest mean"
    methylation_450k: "series-matrix beta values (minfi; the M/U intensity files have no probe ids, switched before modelling); drop probes with any missing value and non-CpG 'rs' probes; beta clipped to [0.001, 0.999]; M-value = log2(beta / (1 - beta)); chromosome from the Illumina 450K v1.1 manifest"
    all: "remove chrX, chrY and mitochondrial features before any analysis (features without chromosome annotation kept)"
  cpm_min: 1.0
  cpm_min_fraction: 0.20
  classifier:
    variance_filter_top: 5000          # label-blind, over all selected samples
    k_features: 50                     # in-fold Welch |t|
    C: 0.1                             # L2 logistic, class_weight balanced, in-fold z-scoring
    n_folds: 5                         # StratifiedGroupKFold, groups = subject (twin pair for GSE16059)
    n_repeats: 20                      # seeds SEED + r; estimate = mean AUROC of pooled OOF scores per repeat
    n_bootstrap: 2000                  # subject/pair-cluster bootstrap of the repeat-averaged OOF score
    n_permutations: 1000               # within-pair label swaps for GSE16059
    permutation_repeats: 5             # statistic = mean AUROC over repeats 0-4, same seeds for observed and null
    covariate_C: 1.0
    alpha: 0.05                        # within-dataset signal = permutation p < alpha (Holm across subsets also reported)
  covariates:                          # covariates-only baseline and DE adjustment
    GSE293840: ["c:Sex", "c:batch", "c:test site"]   # 'age bin' dropped before modelling: batches 2023.08.25/2024.03.05 code bins 1-4, 2024.06.28 codes years, 1 missing
    GSE275334_lc: ["c:Sex", "c:age (years)"]
    GSE227375: ["c:Sex"]
  numeric_covariates: ["c:age bin", "c:age (years)"]
  de:
    model: "per-feature OLS feature ~ label + covariates; GSE16059 paired t-test on within-pair differences (CFS minus co-twin)"
    features: "all features passing preprocessing (not only the top 5000), autosomal"
    fdr: "Benjamini-Hochberg"
    report: "n q<0.05, n q<0.10, fraction p<0.05, genomic inflation lambda, top 25"
  confounds:
    crosstabs: "label x batch / site / sex / platform where recorded (Fisher exact 2x2, else chi-square)"
    inferred_sex: "XIST and >=2 of RPS4Y1, DDX3Y, KDM5D, UTY, EIF1AY, USP9Y: score = mean z(Y) - z(XIST), male if > 0; computed before the sex-chromosome removal and used only for this audit"
  transfer:
    universe: "autosomal genes present after preprocessing in both cohorts; each cohort z-scored per gene over its own samples (label-blind)"
    model: "the classifier above trained on the whole source cohort (variance filter on the source only)"
    n_bootstrap: 2000
    n_permutations: 1000
    replicated_if: "target AUROC 95% CI lower bound > 0.5 AND permutation p < 0.05"
    pairs:
      - {source: GSE226260_wb, target: GSE270045, tier: primary}
      - {source: GSE270045, target: GSE226260_wb, tier: primary}
      - {source: GSE16059, target: GSE227375, tier: primary}
      - {source: GSE227375, target: GSE16059, tier: primary}
      - {source: GSE275334_lc, target: GSE226260_wb, tier: secondary}
      - {source: GSE226260_wb, target: GSE275334_lc, tier: secondary}
      - {source: GSE275334_lc, target: GSE270045, tier: secondary}
      - {source: GSE270045, target: GSE275334_lc, tier: secondary}
    untestable: {GSE293840: "no eligible plasma cfRNA partner", GSE156792: "no eligible T-cell methylation partner"}
  overlap:
    top_n: 100
    n_null_draws: 10000
    note: "random-gene null ignores gene-gene correlation (lenient); Spearman of DE t over the shared universe is descriptive only"
  signatures:
    write_if: "classifier permutation p < 0.05"
    rows: "FDR-significant DE features (q < 0.05), at most 50 by p"
    evidence_level: "dataset_specific, or replicated_transfer only if a primary transfer of that subset passes"
  not_done: "no second classifier, no tuning of k/C/filter, no alternative normalisation, no re-selection of datasets, no subgroup analyses in the primary report"
