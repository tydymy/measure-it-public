  # ------------------------------------------------------------------ excluded on design (metadata)
  GSE215865: {exclude: ACUTE_SAMPLING_NO_LABEL, note: "whole blood drawn during ACUTE COVID-19 (T1 = first sample); long-term sequelae outcome is not a sample characteristic"}
  GSE173590: {exclude: NOT_TARGET_CONDITION, note: "acute/convalescent mild-moderate COVID-19 vs healthy; no Long COVID label"}
  GSE267625: {exclude: NO_CONTROL_GROUP, note: "all samples long-COVID patients at 3 and 12 months; no control label"}
  GSE299837: {exclude: IN_VITRO, note: "primary bronchial epithelial cells infected in vitro"}
  GSE275563: {exclude: ANIMAL_MODEL, note: "lung tissue from humanised (LoM) mice infected with SARS-CoV-2"}
  GSE261777: {exclude: NO_CONTROL_GROUP, note: "nasal epithelium, all samples 'long COVID'"}
  GSE228320: {exclude: NO_CONTROL_GROUP, note: "whole blood after COVID ARDS; DLCO is continuous, no case/control label"}
  GSE290042: {exclude: IN_VITRO, note: "A549 cell line transfected with coronavirus nucleocapsids"}
  GSE263817: {exclude: SINGLE_CELL, note: "scRNA-seq, human PBMC/BAL and mouse samples"}
  GSE236562: {exclude: POSTMORTEM_TISSUE, note: "post-mortem brain; COVID vs control (not Long COVID)"}
