# Specialty and facility groups over NUCC Health Care Provider Taxonomy codes.
#
# Codes were chosen by hand from the NUCC v26.1 CSV
# (data/raw/nucc_taxonomy/nucc_taxonomy_261.csv, https://www.nucc.org/images/stories/CSV/nucc_taxonomy_261.csv);
# display names are copied verbatim from that file and tests/test_nppes.py checks every code and name against it.
#
# Semantics
#   * An NPI matches a group if ANY of its (up to 15) NPPES taxonomy codes is listed here; it matches the group
#     as primary if its primary taxonomy (Primary Taxonomy Switch = Y) is listed.
#   * Groups overlap by design (e.g. 207RC0001X is in cardiology and electrophysiology; 2081P2900X in pain_medicine
#     and pmr). Never sum counts across groups.
#   * role: physician / nurse_practitioner / physician_assistant / other_individual / facility, from NUCC grouping.
#   * spec_listed: true for the 13 SPEC section F groups; false for the extra facility/research groups.
#   * excluded_considered: codes that were considered and deliberately left out, with the reason.
#
# CAVEAT: an NPI taxonomy is self-reported and does NOT mean that a provider evaluates or treats Long COVID,
# ME/CFS, POTS or any other invisible illness.
version: 1
nucc_version: '26.1'
nucc_file: nucc_taxonomy_261.csv
nucc_url: https://www.nucc.org/images/stories/CSV/nucc_taxonomy_261.csv
created: '2026-09-23'
groups:
