      display_name: Cardiovascular Disease Physician
      role: physician
    - code: 207RI0011X
      display_name: Interventional Cardiology Physician
      role: physician
    - code: 207RA0001X
      display_name: Advanced Heart Failure and Transplant Cardiology Physician
      role: physician
    - code: 207RA0002X
      display_name: Adult Congenital Heart Disease Physician
      role: physician
    - code: 207RC0001X
      display_name: Clinical Cardiac Electrophysiology Physician
      role: physician
    - code: 2080P0202X
      display_name: Pediatric Cardiology Physician
      role: physician
    notes: 'Internal-medicine cardiology classifications plus pediatric cardiology. Clinical Cardiac Electrophysiology (207RC0001X)
      is ALSO in the electrophysiology group: groups overlap by design.'
    excluded_considered:
    - code: 207RH0005X
      display_name: Hypertension Specialist Physician
      reason: hypertension specialists are not necessarily cardiologists
    - code: 207UN0901X
      display_name: Nuclear Cardiology Physician
      reason: nuclear-medicine physicians reading cardiac imaging; rarely longitudinal outpatient care
    - code: 208G00000X
      display_name: Thoracic Surgery (Cardiothoracic Vascular Surgery) Physician
      reason: cardiothoracic surgeons, surgical not medical cardiology
    - code: 246X00000X
      display_name: Cardiovascular Specialist/Technologist
      reason: technologist, not a treating clinician
    - code: 246W00000X
      display_name: Cardiology Technician
      reason: technician, not a treating clinician
    - code: 261QR0404X
      display_name: Cardiac Rehabilitation Clinic/Center
      reason: facility code; see facility group cardiac_rehabilitation
