  limitations:
  - Single exploratory case-control cohort (paper analytic n = 17 PI-ME/CFS + 21 HV); deposits include participants
    outside that cohort and no open file flags adjudication status.
  - Wearable/actigraphy/HRV/orthostatic/CPET per-participant data are gated on mapMECFS; open source data for these
    carry group labels only, so they are not person-level data here.
  - Participant 311 is labelled Male in both GEO RNA-seq deposits and Female in both SomaLogic deposits; flagged
    (sex_concordant_across_sources = False), not corrected.
  - Serum SomaLogic is attached to participants through the Fatigue-NNN pairing published only in the CSF deposit
    (GSE251790); corroborated by sex/age/group agreement, not by an ID in the serum deposit.
  - CSF metabolomics source data carry study numbers only on rows with Birth Sex = 1; other rows are not linkable.
  - Supplementary Data 14A 'adjusted p-value' is not a monotone adjustment of its 'p-value' column (see audit),
    so fdr_significant is UNKNOWN for its 142 rows (kept as published in adj_p_value); Supplementary Data 18 log2FoldChange
    orientation is unverifiable (direction UNKNOWN).
  - 'Supplementary Data 17 value scales, established against the GEO ADAT RFUs: 17A RFU, 17B log2_RFU. effect_value
    is the log2 ratio of group medians for RFU values and the difference of group medians for log2(RFU) values (value_scale
    column).'
  - Condition evidence rows for SD15/17/20/21 take direction from group medians computed from the individual values
    published in the same table; p-values are as published.
  - GEO PBMC deposit has 27 samples while the PBMC DE analysis used 29 (source data 15 HV + 14 PI); stated n in
    MOESM3 differs from source-data counts for SD16C (stated 8 HV, Fig. 8F has 9).
