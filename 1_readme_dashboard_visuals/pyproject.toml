[project]
name = "measure-it-public"
version = "0.1.0"
description = "Measure It to Cure It: public-data-only alpha of an invisible-illness measurement-validation and deployment engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.1",
    "requests>=2.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "networkx>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fastmcp>=2.0",
    "streamlit>=1.38",
    "umap-learn>=0.5",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
    "pyreadstat>=1.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",       # legacy .xls supplements (hEDS/HSD Olink clinical sheet; device/lab discovery inspection)
    "mat-io>=0.5",     # MATLAB table objects in a device-discovery candidate (import name: matio)
    "typer>=0.12",
    "pydantic>=2.7",
    "sqlglot>=25",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
measure-it = "measure_it.cli:app"

[project.optional-dependencies]
agent = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measure_it"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test hits a live federal/biomedical API (deselect with -m 'not network')",
    "data: test needs processed data under data/processed (run the pipeline first)",
]
